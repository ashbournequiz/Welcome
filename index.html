<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to Ashbourne's Vocabulary Game Hub</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
    }

    /* Background video */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    /* Dark overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    /* Shared content styles */
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
      color: white;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-top: 6px;
    }

    /* Login screen */
    #login-screen {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 10px;
    }

    .login-box input {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      margin-top: 10px;
      width: 200px;
    }

    .login-box button {
      margin-top: 15px;
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    /* Hide main site initially */
    #main-site {
      display: none;
    }

    /* Section blocks */
    .letter-group {
      margin: 30px 0;
    }

    .letter-title {
      font-size: 22px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .links a {
      display: inline-block;
      margin: 6px 10px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 6px;
      color: white;
      text-decoration: none;
      font-size: 16px;
    }

    .links a:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>

<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="bgvid.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Enter Passcode</h2>
      <input type="password" id="password" placeholder="Password">
      <br>
      <button onclick="checkPassword()">Enter</button>
      <p id="error" style="color: #ff8080;"></p>
    </div>
  </div>

  <!-- MAIN SITE -->
  <div id="main-site" class="content">

    <h1>Welcome to Ashbourne's Vocabulary Game Hub</h1>
    <p>These games are organised by alphabet and level of difficulty.</p>
    <p>Please choose where you’d like to go:</p>

    <!-- (ALL YOUR EXISTING CONTENT BELOW IS UNCHANGED) -->

    <div class="letter-group">
      <div class="letter-title">A</div>
      <div class="links">
        <a href="https://ashbournequiz.github.io/Vocabulary-Game/">Easy</a>
        <a href="https://ashbournequiz.github.io/Hangman-A/">Hard</a>
      </div>
    </div>

    <!-- (Rest of your sections stay exactly the same) -->

  </div>

  <script>
    function checkPassword() {
      const correctPassword = "Ashbourne123"; // CHANGE THIS
      const entered = document.getElementById("password").value;

      if (entered === correctPassword) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("main-site").style.display = "block";
      } else {
        document.getElementById("error").textContent = "Incorrect password.";
      }
    }
  </script>

</body>
</html>
